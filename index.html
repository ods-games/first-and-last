<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="First&amp;Last">
<meta name="theme-color" content="#D6EEFF">
<meta name="description" content="시작 글자와 끝 글자로 하는 영어 단어 대결 게임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif}
[hidden]{display:none!important}
</style>
<title>First&amp;Last</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap">
<style>
/* Layout: one phone-shaped column; arena (sky + two fighters) between the players' keyboards. Single pastel game world in both themes. */
:root{
  --ink:#4A3426; --sky:#D6EEFF; --grass:#CDEFBE; --grass2:#B7E3A6; --cream:#FFF4E8;
  --pink:#FF8FAB; --mint:#BDEBD8; --yellow:#FFE07A; --blush:#FFB3C7; --paper:#FFFFFF;
  --muted:#E9E1DA; --water:#8FD0FF; --red:#D9435B; --page:#F3E7DA; --soft:#6B5547;
  --display:'Fredoka','Jua',ui-rounded,system-ui,sans-serif;
  --korean:'Jua','Fredoka',ui-rounded,system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--display);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--sky);position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- home ---------- */
#home{padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:16px;overflow-y:auto;background:var(--sky)}
.home-top{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pill{border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:4px 12px;font-family:var(--korean);font-size:15px}
.logo{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px;flex-wrap:wrap}
.logo .tile{width:56px;height:56px;font-size:36px}
.logo .rest{font-size:34px;font-weight:700;letter-spacing:.5px}
.tagline{text-align:center;font-family:var(--korean);font-size:17px;margin-top:-6px;text-wrap:balance}
.home-cast{display:flex;justify-content:center;align-items:flex-end;gap:10px;height:140px}
.home-cast svg{height:100%;width:auto}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{border:4px solid var(--ink);border-radius:20px;background:var(--cream);padding:10px 10px 10px 14px;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:center;gap:10px}
.mname{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:none;padding:4px 0;text-align:left;font-family:var(--korean);font-size:22px}
.mname small{font-size:14px;color:var(--soft)}
.mname svg{width:18px;height:18px;flex:none;transition:transform .2s}
.mname[aria-expanded="true"] svg{transform:rotate(180deg)}
.mdesc{display:flex;flex-direction:column;gap:10px;font-family:var(--korean);font-size:15px;color:var(--soft);line-height:1.4}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.diff{border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:8px 0;font-family:var(--korean);font-size:15px;color:var(--ink)}
.diff[aria-pressed="true"]{background:var(--yellow)}
.go{border:4px solid var(--ink);border-radius:16px;background:var(--pink);box-shadow:0 4px 0 var(--ink);padding:8px 18px;font-family:var(--korean);font-size:20px}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.go.alt{background:var(--mint)}
.go.soon{background:var(--paper)}

/* ---------- game ---------- */
.tile{display:flex;align-items:center;justify-content:center;border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);font-weight:700;background:var(--paper);box-sizing:border-box}
#arena{flex:1;min-height:0;position:relative;overflow:hidden;container-type:size;background:var(--sky)}
.sun{position:absolute;left:8%;top:9%;width:15cqh;height:15cqh;max-width:70px;max-height:70px;border-radius:50%;background:#FFF6C9}
.cloud{position:absolute;right:6%;top:14%;width:24cqw;height:5cqh;border-radius:999px;background:var(--paper)}
.ground,.groundT{position:absolute;left:-10%;right:-10%;height:30cqh;background:var(--grass)}
.ground2,.groundT2{position:absolute;left:-10%;right:-10%;height:26cqh;background:var(--grass2)}
.ground{bottom:-10cqh;border-radius:50% 50% 0 0}
.ground2{bottom:-16cqh;border-radius:50% 50% 0 0}
.groundT{top:-10cqh;border-radius:0 0 50% 50%;display:none}
.groundT2{top:-16cqh;border-radius:0 0 50% 50%;display:none}
.hill{position:absolute;left:50%;top:41cqh;transform:translateX(-50%);width:min(56cqw,50cqh);height:6cqh;border-radius:50%;background:#BFE6B0;border:4px solid var(--ink)}
.card{position:absolute;z-index:4;border:4px solid var(--ink);border-radius:14px;background:var(--paper);padding:4px 10px;display:flex;flex-direction:column;gap:2px;max-width:44%}
.card .nm{font-family:var(--korean);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{display:flex;gap:3px}
.hearts svg{width:18px;height:16px}
#card1{left:max(10px,env(safe-area-inset-left,0px));top:10px}
#card0{left:max(10px,env(safe-area-inset-left,0px));bottom:12px}
#clock{position:absolute;z-index:4;right:max(10px,env(safe-area-inset-right,0px));top:10px}
.clock{border:4px solid var(--ink);border-radius:999px;background:var(--paper);padding:2px 12px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.clock.hurry{background:var(--pink);animation:pulse .5s ease-in-out infinite alternate}
.tools{position:absolute;z-index:4;right:max(10px,env(safe-area-inset-right,0px));bottom:12px;display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:0}
.icon-btn svg{width:22px;height:22px}
.char{position:absolute;left:50%;z-index:2}
#char1{top:10cqh;height:min(32cqh,200px);transform:translateX(-50%)}
#char0{left:58%;bottom:-7cqh;height:min(36cqh,230px);transform:translateX(-50%)}
.char svg{height:100%;width:auto;display:block;overflow:visible}
.char svg{animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
#char1 svg{animation-delay:-1.3s}
.char.jump svg{animation:jump .45s ease-out}
.flat{transform-box:fill-box;transform-origin:50% 100%;transition:transform .2s}
.mid{position:absolute;left:0;right:0;top:46cqh;display:flex;align-items:flex-start;justify-content:space-between;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:8px;z-index:3}
.side{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--korean);font-size:14px}
.side .tile{width:min(60px,11cqh);height:min(60px,11cqh);font-size:min(36px,7cqh)}
.tS{background:var(--mint)}
.tE{background:var(--blush)}
#center{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
#center.flip{transform:rotate(180deg)}
.msg{background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:6px 12px;font-family:var(--korean);font-size:min(19px,4.2cqh);text-wrap:balance;max-width:100%}
.msg small{display:block;font-size:13px;color:var(--soft)}
.count{font-size:min(84px,14cqh);font-weight:700;line-height:1;color:var(--ink);-webkit-text-stroke:0;text-shadow:3px 3px 0 var(--paper),-3px -3px 0 var(--paper),3px -3px 0 var(--paper),-3px 3px 0 var(--paper);animation:countPop .9s ease-out}
.count.low{color:var(--red)}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{border:3px solid var(--ink);border-radius:10px;padding:1px 8px;font-size:15px;font-weight:600;background:var(--paper);animation:pop .35s ease-out}
.chip.p0{background:var(--yellow)}
button.chip{cursor:pointer;color:var(--ink)}
.duo .chip.p1{background:var(--mint)}
.roul{display:flex;gap:14px;align-items:flex-end}
.roul .slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.roul .tile{width:60px;height:60px;font-size:36px}
.roul .tag{font-family:var(--korean);font-size:15px;border:3px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--yellow);visibility:hidden}
.roul .on .tag{visibility:visible}
.roul .on .tile{background:var(--mint)}
.bubble{position:absolute;z-index:5;border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:2px 10px;font-family:var(--korean);font-size:15px;white-space:nowrap;animation:pop .3s ease-out}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.fly{position:absolute;left:0;top:0;width:32px;height:32px;margin:-16px 0 0 -16px;border:3px solid var(--ink);border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.burst{position:absolute;left:0;top:0;width:96px;height:80px;margin:-40px 0 0 -48px;display:flex;align-items:center;justify-content:center;font-family:var(--korean);font-size:22px}
.burst svg{position:absolute;inset:0;width:100%;height:100%}
.burst span{position:relative}
.ko-banner{position:absolute;left:50%;top:44cqh;transform:translate(-50%,-50%) rotate(-6deg);z-index:7;background:var(--yellow);border:5px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:2px 22px;font-size:min(52px,9cqh);font-weight:700;animation:stamp .4s cubic-bezier(.2,1.6,.4,1)}
.shake{animation:shake .35s linear}
#rail{display:none}

/* duo: both players face away from the middle; the top half belongs to the player across the table */
.duo .sun,.duo .cloud,.duo .hill,.duo #clock,.duo .mid .side{display:none}
.duo .groundT,.duo .groundT2{display:block}
.duo #char1{top:-7cqh;left:42%;height:min(36cqh,230px);transform:translateX(-50%) rotate(180deg)}
.duo #card1{transform:rotate(180deg);left:auto;right:max(10px,env(safe-area-inset-right,0px));top:10px}
.duo .mid{top:39cqh;padding-right:96px}
.duo #rail{display:flex;position:absolute;z-index:4;left:calc(100% - 50px);top:50%;transform:translate(-50%,-50%) rotate(90deg);align-items:center;gap:12px}
#rail .side{flex-direction:row;gap:6px}
#rail .tile{width:48px;height:48px;font-size:28px;border-radius:12px;box-shadow:0 4px 0 var(--ink)}

/* ---------- panels (keyboard) ---------- */
.panel{flex:none;background:var(--cream);border-top:4px solid var(--ink);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;position:relative}
#panel1{border-top:none;border-bottom:4px solid var(--ink);transform:rotate(180deg)}
.row-in{display:flex;gap:6px}
.typed{flex:1;min-width:0;height:46px;box-sizing:border-box;border:4px solid var(--ink);border-radius:14px;background:var(--paper);display:flex;align-items:center;padding:0 12px;font-size:22px;font-weight:600;letter-spacing:2px;overflow:hidden;white-space:nowrap}
.typed:empty::before{content:attr(data-ph);font-family:var(--korean);font-size:16px;letter-spacing:0;color:#8A7466}
.typed.bad{animation:shake .35s linear;border-color:var(--red)}
.act{height:46px;border:4px solid var(--ink);border-radius:14px;background:var(--pink);box-shadow:0 4px 0 var(--ink);padding:0 12px;font-family:var(--korean);font-size:18px;white-space:nowrap}
.act.hint{background:var(--paper);font-size:15px}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.act:disabled{opacity:.4;box-shadow:none}
.kb{display:flex;flex-direction:column;gap:6px}
.kb .r{display:flex;justify-content:center;gap:4px}
.key{flex:1;max-width:40px;height:42px;padding:0;border:3px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:0 3px 0 var(--ink);font-size:17px;font-weight:600}
.key.wide{max-width:60px;flex:1.5;font-size:15px}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.key:disabled{opacity:.3;box-shadow:none}
.panel.pick .key:not(:disabled){animation:rainbow 1.6s linear infinite,twinkle .8s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -90ms),calc(var(--i) * -60ms)}
.panel.frozen .kb,.panel.frozen .row-in{opacity:.45;pointer-events:none;filter:saturate(.3)}
.frost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;pointer-events:none}
.frost b.lockn{display:block;text-align:center;font-family:var(--display);font-size:40px;line-height:1.1;animation:countPop .9s ease-out}
.frost span{background:var(--ink);color:var(--paper);border-radius:14px;padding:6px 14px;font-family:var(--korean);font-size:18px}
.toast{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);z-index:9;background:var(--ink);color:var(--paper);border-radius:12px;padding:6px 12px;font-family:var(--korean);font-size:15px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;animation:pop .25s ease-out}
.buzzer{height:64px;border:4px solid var(--ink);border-radius:20px;background:var(--yellow);box-shadow:0 5px 0 var(--ink);font-family:var(--korean);font-size:26px;align-items:center;justify-content:center}
.buzzer:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.buzzer:disabled{background:var(--muted);box-shadow:none;font-size:18px}
.tbar{height:8px;border-radius:4px;background:var(--muted);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--pink);transform-origin:left}
.panel .kb,.panel .row-in,.panel .tbar,.panel .buzzer{display:none}
.panel.pick .kb,.panel.type .kb,.panel.type .row-in,.panel.buzz .buzzer{display:flex}
.duo .panel.type .tbar{display:block}
.duo .panel.wait .buzzer,.duo .panel.off .buzzer{display:flex}
#game:not(.duo) .panel.off .kb,#game:not(.duo) .panel.off .row-in,#game:not(.duo) .panel.pick .row-in{display:flex}
#game:not(.duo) .panel.off .kb,#game:not(.duo) .panel.off .row-in{opacity:.45;pointer-events:none}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(74,52,38,.45);display:flex;align-items:center;justify-content:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{position:relative;width:100%;max-width:400px;max-height:100%;overflow-y:auto;background:var(--cream);border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;animation:pop .3s ease-out}
.sheet h2{margin:0 30px;text-align:center;font-family:var(--korean);font-weight:400;font-size:28px}
.sheet p{margin:0;font-family:var(--korean);font-size:18px;line-height:1.45;text-align:center;text-wrap:balance}
.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border:3px solid var(--ink);border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:0}
.x svg{width:16px;height:16px}
.tut-art{height:100px;display:flex;align-items:center;justify-content:center;gap:10px}
.tut-art .tile{width:58px;height:58px;font-size:34px}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.dots i.on{background:var(--ink)}
.btns{display:flex;gap:10px}
.btns .go{flex:1;font-size:19px}
.btns .go:disabled{visibility:hidden}
.res-words{display:flex;flex-direction:column;gap:8px}
.res-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res-row b{font-family:var(--korean);font-weight:400;font-size:16px;min-width:70px}
.score{font-size:40px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}

@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes countPop{from{transform:scale(1.6);opacity:.2}to{transform:scale(1);opacity:1}}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes breathe{50%{transform:scale(1.025,.975) translateY(1px)}}
@keyframes jump{40%{transform:translateY(-14px)}}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-6deg) scale(2.2);opacity:0}}
@keyframes rainbow{0%{background:#FFE07A}20%{background:#FFB3C7}40%{background:#C9B8FF}60%{background:#8FD0FF}80%{background:#BDEBD8}100%{background:#FFE07A}}
@keyframes twinkle{to{transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important}}
</style>

</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <div class="home-top">
      <button class="pill" id="fsBtn" type="button" hidden></button>
      <button class="pill" id="langBtn" type="button"></button>
      <button class="pill" id="soundBtn" type="button"></button>
      <button class="pill" id="musicBtn" type="button"></button>
      <button class="pill" id="rulesBtn" type="button" data-t="rules"></button>
    </div>
    <div class="logo" aria-label="First&amp;Last">
      <div class="tile" style="background:var(--mint)">F</div><span class="rest">irst&amp;</span>
      <div class="tile" style="background:var(--blush)">L</div><span class="rest">ast</span>
    </div>
    <div class="tagline" data-t="tagline"></div>
    <div class="home-cast" id="homeCast"></div>
    <div class="modes">
      <div class="mode">
        <div class="mrow"><button class="mname" type="button" aria-expanded="false" aria-controls="dSolo" data-x="dSolo"><span data-t="solo"></span><small id="diffNow"></small><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg></button><button class="go" id="goAI" type="button" data-t="start"></button></div>
        <div class="mdesc" id="dSolo" hidden><span data-t="soloNote"></span>
          <div class="diffs" id="diffs">
            <button class="diff" type="button" data-d="easy" data-t="easy"></button>
            <button class="diff" type="button" data-d="medium" data-t="medium"></button>
            <button class="diff" type="button" data-d="hard" data-t="hard"></button>
          </div><span id="diffNote"></span></div>
      </div>
      <div class="mode">
        <div class="mrow"><button class="mname" type="button" aria-expanded="false" aria-controls="dDuo" data-x="dDuo"><span data-t="duo"></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg></button><button class="go alt" id="goDuo" type="button" data-t="start"></button></div>
        <div class="mdesc" id="dDuo" hidden><span data-t="duoNote"></span></div>
      </div>
      <div class="mode">
        <div class="mrow"><button class="mname" type="button" aria-expanded="false" aria-controls="dOn" data-x="dOn"><span data-t="online"></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg></button><button class="go soon" id="goOnline" type="button" data-t="start"></button></div>
        <div class="mdesc" id="dOn" hidden><span data-t="onlineNote"></span></div>
      </div>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="panel" id="panel1"></div>
    <div id="arena">
      <div class="sun"></div><div class="cloud"></div>
      <div class="ground"></div><div class="ground2"></div><div class="groundT"></div><div class="groundT2"></div><div class="hill"></div>
      <div class="card" id="card1"><div class="nm" id="name1"></div><div class="hearts" id="hearts1"></div></div>
      <div class="clock" id="clock">2:00</div>

}
function autoPick(p) {
  const pool = p === 0 ? [...LETTERS].filter(l => partners(l).length) : partners(G.picks[0]);
  pickLetter(p, pool[Math.floor(Math.random() * pool.length)]);
}
function pickLetter(p, l) {
  if (G.phase !== 'pick' || G.picker !== p || !l) return;
  clearInterval(G.pickId); sfx('pick'); G.picks[p] = l;
  if (p === 0) {
    setTiles(l.toUpperCase(), '?');
    const opts = partners(l);
    if (!opts.length) { G.picker = -1; renderPanels(); setCenter(`<div class="msg">${esc(t('tooFew'))}</div>`); return later(() => beginPick(), 1600); }
    if (G.mode === 'ai') {
      const score = x => Math.max(cnt(l, x), cnt(x, l));
      const s = opts.slice().sort((x, y) => G.diff === 'hard' ? score(x) - score(y) : score(y) - score(x));
      const b = s[Math.floor(Math.random() * Math.min(G.diff === 'hard' ? 4 : 8, s.length))];
      G.picks[1] = b; G.picker = -1; renderPanels();
      setCenter(`<div class="msg">${esc(t('aiPicked', { name: t('ai'), L: b.toUpperCase() }))}</div>`);
      jump(1); setTiles(l.toUpperCase(), b.toUpperCase());
      later(roulette, 1200);
    } else { G.picker = 1; renderPanels(); pickPrompt(); }
  } else { setTiles(G.picks[0].toUpperCase(), l.toUpperCase()); G.picker = -1; renderPanels(); later(roulette, 500); }
}
function jump(p) { const c = charEl(p); c.classList.remove('jump'); void c.offsetWidth; c.classList.add('jump'); }
function roulette() {
  const [a, b] = G.picks, dirs = dirsOK(a, b);
  if (!dirs.length) { setCenter(`<div class="msg">${esc(t('tooFew'))}</div>`); return later(() => beginPick(), 1600); }
  G.phase = 'roulette'; renderPanels();
  const chosen = dirs[Math.floor(Math.random() * dirs.length)];
  const finalIdx = chosen[0] === a ? 0 : 1;
  setCenter(`<div class="msg">${esc(t('roulette'))}</div><div class="roul"><div class="slot" id="rs0"><span class="tag">${t('startLbl')}</span><div class="tile">${a.toUpperCase()}</div></div><div class="slot" id="rs1"><span class="tag">${t('startLbl')}</span><div class="tile">${b.toUpperCase()}</div></div></div>`);
  // the highlight alternates 0,1,0,1…; the last step's parity lands on the chosen start letter
  const total = finalIdx === 1 ? 10 : 11; let i = 0;
  const run = () => {
    const on = i % 2; $('rs0').classList.toggle('on', on === 0); $('rs1').classList.toggle('on', on === 1); sfx('roll');
    if (i >= total - 1 || a === b) { G.start = chosen[0]; G.end = chosen[1]; setTiles(G.start.toUpperCase(), G.end.toUpperCase()); later(startPlay, 900); return; }
    i++; later(run, 70 + i * i * 4);
  };
  run();
}
function startPlay() {
  G.phase = 'play'; G.input = ['', ''];
  setCenter(`${isDuo() ? '' : `<div class="msg">${esc(t('startEnd', { S: G.start.toUpperCase(), E: G.end.toUpperCase() }))}<small>${esc(t('fight'))}</small></div>`}<div class="words"></div>`);
  setFace(0, 'idle'); setFace(1, 'idle'); renderPanels(); startClock(); scheduleAI(); startIdle(); sfx('go');
}
/* while waiting, characters now and then glance back or hop */
function startIdle() {
  clearInterval(G.idleId);
  G.idleId = setInterval(() => {
    if (G.phase !== 'play' || paused()) return;
    const p = Math.random() < .5 ? 0 : 1;
    if (G.faces[p] !== 'idle') return;
    const backStyle = p === 0 || isDuo();
    if (backStyle && Math.random() < .6) setFace(p, 'look', 1200, 'idle'); else jump(p);
  }, 3500);
}
function startClock() {
  clearInterval(G.clockId); renderClock();
  G.clockId = setInterval(() => {
    if (G.phase !== 'play' || paused()) return;
    G.time--; renderClock(); MUS.fast = G.time <= 30; if (G.time <= 10 && G.time > 0) sfx('tick');
    if (G.time <= 0) { clearInterval(G.clockId); finish(G.scores[0] > G.scores[1] ? 0 : G.scores[1] > G.scores[0] ? 1 : null, true); }
  }, 1000);
}

/* ---------- words ---------- */
function check(w, p) {
  const S = G.start.toUpperCase(), E = G.end.toUpperCase();
  if (w.length < 3) return { msg: t('short') };
  if (w[0] !== G.start || w[w.length - 1] !== G.end) return { msg: t('mismatch', { S, E }) };
  if (G.used.has(w)) return { msg: G.used.get(w) === p ? t('usedMe') : t('usedOpp') };
  if (VALID.has(w)) return null;
  const b = baseOf(w); if (b) return { msg: t('base', { w, b }) };
  if (PROPER.has(w)) return { msg: t('proper') };
  return { msg: t('notword'), unknown: true };
}
function submit(p) {
  if (G.phase !== 'play' || panelMode(p) !== 'type') return;
  const w = G.input[p]; if (!w) return;
  const err = check(w, p);
  if (!err) return accept(p, w);
  sfx('wrong'); voice(p, 'huh'); setFace(p, 'scratch', 1600);
  penalize(p, err.msg);
}
/* any wrong answer: that player's keyboard (solo) or buzzer (duo) is locked for 3 seconds */
function penalize(p, msg) {
  G.input[p] = '';
  if (isDuo()) { clearTimeout(G.buzzId); G.active = null; }
  G.lock[p] = true; G.lockLeft[p] = 5; clearInterval(G.lockId[p]);
  renderPanels(); toast(p, msg, 2000);
  G.lockId[p] = setInterval(() => {
    if (paused()) return;
    G.lockLeft[p]--;
    if (G.lockLeft[p] <= 0) { clearInterval(G.lockId[p]); G.lock[p] = false; if (G.phase === 'play') renderPanels(); return; }
    /* update only the countdown so the error message stays visible */
    const el = $('panel' + p), n = $('panel' + p).querySelector('.lockn'), bz = el.querySelector('.buzzer');
    if (n) { n.textContent = G.lockLeft[p]; n.nextSibling.textContent = t('frozen', { n: G.lockLeft[p] }); }
    if (bz && isDuo()) bz.textContent = t('frozen', { n: G.lockLeft[p] });
  }, 1000);
}
function accept(p, w) {
  sayWord(w);
  G.used.set(w, p); G.order.push([w, p]); G.input[p] = ''; G.scores[p]++;
  const n = G.scores[p];
  if (isDuo()) { clearTimeout(G.buzzId); G.active = null; }
  if (n >= 3) { G.phase = 'ko'; clearInterval(G.clockId); clearTimeout(G.aiId); }
  const box = $('center').querySelector('.words');
  if (box) box.innerHTML = G.order.map(([x, q]) => `<span class="chip p${q}">${x.toUpperCase()}</span>`).join('');
  renderPanels();
  const tok = G.token;
  attack(p, w, n, tok).then(() => { if (n >= 3 && tok === G.token) finish(p, false); });
}
function hint() {
  if (G.phase !== 'play' || G.hintUsed) return;
  const pool = (IDX[G.start + G.end] || []).filter(w => !G.used.has(w));
  if (!pool.length) return toast(0, t('notword'));
  const w = pool[Math.floor(Math.random() * pool.length)];
  const shown = [...w].map((c, i) => (i === 0 || i === 1 || i === w.length - 1) ? c.toUpperCase() : '_').join(' ');
  G.hintUsed = true; renderPanels(); toast(0, shown, 4000); sfx('pick');
}

/* ---------- AI ---------- */
function scheduleAI() {
  clearTimeout(G.aiId);
  if (G.mode !== 'ai' || G.phase !== 'play') return;
  const cfg = AI_CFG[G.diff], n = Math.max(1, cnt(G.start, G.end));
  const f = Math.min(2, Math.max(.7, Math.sqrt(40 / n)));
  G.aiDue = Date.now() + cfg.base * f * (.75 + Math.random() * .5) * 1000;
  const tick = () => {
    if (G.phase !== 'play') return;
    if (paused()) G.aiDue += 500;
    if (Date.now() >= G.aiDue) return aiMove();
    if (G.aiDue - Date.now() < 2500 && !document.querySelector('.bubble.b1')) { bubble(1, t('thinking'), 2400); voice(1, 'hmm'); }
    G.aiId = setTimeout(tick, 500);
  };
  G.aiId = setTimeout(tick, 500);
}
function aiMove() {
  const cfg = AI_CFG[G.diff], key = G.start + G.end;
  let pool = ((cfg.easy ? IDX_E[key] : IDX[key]) || []).filter(w => !G.used.has(w));
  if (!pool.length) pool = (IDX[key] || []).filter(w => !G.used.has(w));
  if (!pool.length) { return; }
  let w;
  if (cfg.hard) { const s = []; for (let i = 0; i < 4; i++) s.push(pool[Math.floor(Math.random() * pool.length)]); w = s.sort((a, b) => b.length - a.length)[0]; }
  else w = pool[Math.floor(Math.random() * pool.length)];
  document.querySelectorAll('.bubble.b1').forEach(x => x.remove());
  accept(1, w);
  if (G.phase === 'play') scheduleAI();
}

/* ---------- duo buzzer ---------- */
function buzz(p) {
  if (!isDuo() || G.phase !== 'play' || G.active !== null || G.lock[p]) return;
  sfx('buzz'); G.active = p; G.input[p] = ''; renderPanels(); runBuzzTimer(p);
}
function cancelBuzz(p) {
  if (!isDuo() || G.phase !== 'play' || G.active !== p) return;
  clearTimeout(G.buzzId); G.active = null; G.input[p] = ''; sfx('key'); renderPanels();
}
function runBuzzTimer(p) {
  clearTimeout(G.buzzId);
  const bar = $('tbar' + p); if (bar) { bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)'; void bar.offsetWidth; bar.style.transition = 'transform 10s linear'; bar.style.transform = 'scaleX(0)'; }
  G.buzzId = setTimeout(() => { if (G.phase === 'play' && G.active === p) { sfx('wrong'); voice(p, 'huh'); setFace(p, 'scratch', 1600); penalize(p, t('timeout')); } }, 10000);
}

/* ---------- attacks ---------- */
function anchor(p) {
  const a = $('arena').getBoundingClientRect(), r = charEl(p).getBoundingClientRect();
  let fy = p === 1 ? .48 : .34; if (isDuo() && p === 1) fy = .66;
  return { x: r.left - a.left + r.width / 2, y: r.top - a.top + r.height * fy };
}
function fly(el, from, to, dur, spin, side) {
  $('fx').appendChild(el);
  const mx = (from.x + to.x) / 2 + side, my = (from.y + to.y) / 2;
  return el.animate([
    { transform: `translate(${from.x}px,${from.y}px) rotate(0deg) scale(.7)` },
    { transform: `translate(${mx}px,${my}px) rotate(${spin / 2}deg) scale(1.25)`, offset: .5 },
    { transform: `translate(${to.x}px,${to.y}px) rotate(${spin}deg) scale(1)` }], { duration: dur, easing: 'cubic-bezier(.3,.1,.6,1)', fill: 'forwards' }).finished.then(() => el.remove());
}
function burst(at, html, text) {
  const d = document.createElement('div'); d.className = 'burst'; d.innerHTML = html + `<span>${text}</span>`;
  $('fx').appendChild(d);
  const T = s => `translate(${at.x}px,${at.y}px) scale(${s})`;
  d.animate([{ transform: T(.3), opacity: 0 }, { transform: T(1.15), opacity: 1, offset: .25 }, { transform: T(1), opacity: 1, offset: .8 }, { transform: T(1), opacity: 0 }], { duration: 1200, fill: 'forwards' }).finished.then(() => d.remove());
}
function shakeArena() { const a = $('arena'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); }
const wait = ms => new Promise(r => setTimeout(r, ms));
async function attack(p, w, n, tok) {
  const live = () => tok === G.token;
  const q = other(p), from = anchor(p), to = anchor(q), side = p === 0 ? 60 : -60;
  if (p === 0 || isDuo()) setFace(p, 'throw'); else jump(1);
  voice(p, 'hup');
  if (n === 1) {
    sfx('whoosh');
    const letters = [...w.toUpperCase()].slice(0, 8);
    const flights = letters.map((c, i) => wait(i * 130).then(() => {
      const el = document.createElement('div'); el.className = 'fly'; el.textContent = c; return fly(el, from, to, 1000, 360 * (i % 2 ? 1 : -1), side).then(() => { if (live() && i > 0) sfx('block'); });
    }));
    await flights[0]; if (!live()) return; burst(to, BURST, lang === 'ko' ? '뿅!' : 'POP!'); sfx('block'); sfx('pop'); voice(q, 'ouch'); setFace(q, 'hit', 1600); await Promise.all(flights);
  } else if (n === 2) {
    sfx('whoosh');
    const el = document.createElement('div'); el.style.cssText = 'position:absolute;left:0;top:0;margin:-26px 0 0 -22px'; el.innerHTML = BALLOON;
    await fly(el, from, to, 1200, 160, side);
    if (!live()) return;
    burst(to, SPLASH, lang === 'ko' ? '철퍽!' : 'SPLASH!'); sfx('splash'); voice(q, 'ouch'); setFace(q, 'wet', 1900); shakeArena();
  } else {
    /* the hammer swings down around its handle end so the head's face lands on the target's head */
    const holder = document.createElement('div');
    const flipT = isDuo() && q === 1;
    holder.style.cssText = `position:absolute;left:0;top:0;transform:translate(${to.x}px,${to.y}px) rotate(${flipT ? 180 : 0}deg)`;
    const el = document.createElement('div'); el.innerHTML = HAMMER;
    // hammer art: 160x128; head face bottom at (45,122), handle end at (152,64)
    el.style.cssText = 'position:absolute;left:-45px;top:-122px;transform-origin:152px 64px';
    holder.appendChild(el); $('fx').appendChild(holder);
    await el.animate([{ transform: 'rotate(80deg)', opacity: 0 }, { transform: 'rotate(80deg)', opacity: 1, offset: .3 }, { transform: 'rotate(0deg)', opacity: 1 }], { duration: 700, easing: 'cubic-bezier(.55,0,.9,.55)', fill: 'forwards' }).finished;
    if (!live()) return;
    burst(to, BURST, lang === 'ko' ? '뿅!' : 'BONK!'); sfx('bonk'); setTimeout(() => live() && voice(q, 'aww'), 350); setFace(q, 'ko'); shakeArena();
    el.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(18deg)' }], { duration: 250, fill: 'forwards' });
    setTimeout(() => holder.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }).finished.then(() => holder.remove()), 700);
  }
  if (!live()) return;
  renderHearts(); drawFace(q);
  if (n < 3 && (p === 0 || isDuo())) setTimeout(() => { if (!live()) return; setFace(p, 'look', 1100, 'idle'); voice(p, 'yay'); }, 450);
  if (n >= 3) { const b = document.createElement('div'); b.className = 'ko-banner'; b.textContent = 'K.O.!'; $('arena').appendChild(b); await wait(1300); }
}

/* ---------- finish ---------- */
function finish(winner, byTime) {
  if (G.phase === 'over') return;
  G.phase = 'over'; stopAll(); G.lock = [false, false]; renderPanels(); renderClock();
  const tok = G.token;
  document.querySelectorAll('.bubble').forEach(x => x.remove());
  if (winner === 0) { setFace(0, 'win'); setFace(1, 'lose'); }
  else if (winner === 1) { setFace(1, 'win'); setFace(0, 'lose'); }
  setMusic(null); MUS.fast = false;
  if (winner === null) sfx('draw'); else if (winner === 0 || isDuo()) sfx('win'); else sfx('lose');
  if (winner !== null) { setTimeout(() => { if (tok === G.token) { voice(winner, 'yay'); voice(other(winner), 'aww'); } }, 700); }
  let title;
  if (winner === null) title = t('draw');
  else if (G.mode === 'ai') title = winner === 0 ? t('winYou') : t('loseYou');
  else title = t('winName', { name: nameOf(winner) });
  const list = p => { const ws = G.order.filter(x => x[1] === p).map(x => `<button type="button" class="chip p${p}" data-say="${x[0]}">${x[0].toUpperCase()} <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-1px"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3h-2.5z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5"/></svg></button>`).join(''); return ws || `<span style="font-family:var(--korean)">${t('none')}</span>`; };
  setTimeout(() => {
    if (tok !== G.token) return;
    $('sheet').innerHTML = `<h2>${esc(title)}</h2>${byTime ? `<p>${t('timeUp')}</p>` : ''}
      <div class="score">${G.scores[0]} : ${G.scores[1]}</div>
      <div class="res-words"><div class="res-row"><b>${esc(nameOf(0))}</b>${list(0)}</div><div class="res-row"><b>${esc(nameOf(1))}</b>${list(1)}</div></div>
      <p style="font-size:14px">${esc(t('tapToHear'))}</p>
      <p style="font-size:15px">${esc(t('startEnd', { S: G.start.toUpperCase(), E: G.end.toUpperCase() }))}</p>
      <div class="btns"><button class="go alt" type="button" id="resHome">${t('home')}</button><button class="go" type="button" id="resAgain">${t('again')}</button></div>`;
    $('ov').hidden = false;
    $('sheet').querySelectorAll('[data-say]').forEach(b => b.onclick = () => sayWord(b.dataset.say));
    $('resAgain').onclick = () => { sfx('pick'); newGame(G.mode); };
    $('resHome').onclick = () => $('homeBtn').click();
  }, 1200);
}

applyLang();
setMusic('home');
</script>
